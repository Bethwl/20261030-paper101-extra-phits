name: 2026.10.30_Paper10.1_extra_PHITS
tool: PHITS
description: 'Paper 10.1 (PNE 2022) - các đại lượng ngoài MAC, gộp 1 project PHITS.
  IFRAC: % tương tác (Compton/Rayleigh/PE/tạo cặp) = thông lượng x tiết diện riêng
  phần thư viện (multiplier MT -1..-5), lá mỏng mu*x=0.01, 1e6 hạt. KA: kerma tương
  đối không khí - chùm bút chì qua không khí 10 cm + lá mẫu mu*x=0.005; T-Deposit
  (xấp xỉ kerma) + hệ số kerma thư viện (MT -5 x -6), 1e7 hạt. SAFE: nguồn điểm đẳng
  hướng tâm cầu mẫu R=30 cm, năng lượng lắng đọng trong vỏ cầu ±0.025 cm quanh độ
  sâu 0.1/0.3/0.5/0.8/1/1.5/2 cm, 1e7 hạt. SR: nơtron nhanh 1-14 MeV chùm bút chì,
  mẫu 1/2/4/6 cm + BLANK, đếm nơtron chưa va chạm bằng đĩa r=0.05 cm ở z=100 (Sigma_t
  chùm hẹp; Sigma_R của bài báo là đại lượng khác, ~2/3 Sigma_t), 1e6 hạt. THN: nơtron
  nhiệt 0.0253 eV, lá mỏng Sigma_t*x=0.05/0.1/0.2 + BLANK, truyền qua chưa va chạm
  + nơtron thoát (=> phần hấp thụ) + tỉ lệ sigma thư viện (MT -1 tổng, -2 hấp thụ,
  -3 đàn hồi), 1e6 hạt. Số hạt ghi cứng trong từng input (maxcas), KHÔNG dùng @PRIMARIES@;
  trường primaries bên dưới chỉ để tham khảo. Cần extra_packages phits_neu (XS/neu
  JENDL-4.0 rút gọn cho Li,B,O,Al,Si,Ca,Gd). Zeff/Nel không cần mô phỏng (tính từ
  MAC). EGS5 (T-Interact) bị crash ở bản PHITS 3.36 này nên không dùng.'
